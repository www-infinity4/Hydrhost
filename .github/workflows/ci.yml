name: CI - Build and Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || true
        continue-on-error: true

      - name: Build application
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -d "./out" ]; then
            echo "Error: Build output directory 'out' not found"
            exit 1
          fi
          echo "Build completed successfully. Output directory contains:"
          ls -la ./out
